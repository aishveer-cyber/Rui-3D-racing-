
name: Build Rui 3D Racing APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find and Build Game
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew -not -path './.git/*' -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No Gradle wrapper (gradlew) found!"
            echo "Project files:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Found game project in: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Upload APK and AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rui-3D-Racing-builds
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
